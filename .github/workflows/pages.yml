name: Deploy Race
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run build
      - name: Garantir app-release.apk disponível direto em /Dinho/app-release.apk
        run: |
          if [ -f "public/app-release.apk" ] && [ ! -f "dist/app-release.apk" ]; then
            cp "public/app-release.apk" "dist/app-release.apk"
          elif [ -f "app-release.apk" ] && [ ! -f "dist/app-release.apk" ]; then
            cp "app-release.apk" "dist/app-release.apk"
          fi
          ls -lh dist/app-release.apk 2>/dev/null || echo "Aviso: envie app-release.apk na pasta public/ ou na raiz do repositório para habilitar o download direto."
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
