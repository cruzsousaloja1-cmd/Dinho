name: Gerar RACE-release.apk Assinado (com.race.app.oficial)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-release-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do RACE
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 21 (JDK)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar dependências do projeto
        run: npm install --legacy-peer-deps

      - name: Compilar app web RACE para Android Capacitor (base relativo ./)
        env:
          CAPACITOR_BUILD: 'true'
        run: npm run build

      - name: Instalar Capacitor Android e Gerador de Ícones
        run: npm install --no-save --legacy-peer-deps @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/assets@3

      - name: Criar projeto Android nativo limpo (com.race.app.oficial)
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Aplicar ícone oficial RACE (círculo preto, borda vermelha grossa, R + RACE) e Splash Screen
        run: |
          npx @capacitor/assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Restaurar keystore oficial Release do com.race.app.oficial
        uses: actions/cache@v4
        with:
          path: race-keystore
          key: race-oficial-release-keystore-v2

      - name: Preparar keystore Release RSA 2048 (SHA256withRSA)
        run: |
          mkdir -p race-keystore
          if [ ! -f race-keystore/race-oficial-release.jks ]; then
            keytool -genkeypair -v \
              -keystore race-keystore/race-oficial-release.jks \
              -storetype PKCS12 \
              -alias raceoficial \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -storepass RaceOficial2026Release \
              -keypass RaceOficial2026Release \
              -dname "CN=RACE Oficial, OU=Mobile, O=RACE Indaiatuba, L=Indaiatuba, ST=SP, C=BR"
          fi
          ls -lh race-keystore/race-oficial-release.jks

      - name: Configurar permissões, package com.race.app.oficial e assinatura Release no Gradle
        env:
          BUILD_RUN_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'EOF'
          import os
          import re
          from pathlib import Path

          # 1. Permissões no AndroidManifest.xml
          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          manifest = manifest_path.read_text(encoding='utf-8')
          permissions = [
              '    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
              '    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />',
              '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
          ]
          missing = [p for p in permissions if p.strip() not in manifest]
          if missing:
              manifest = manifest.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n' + '\n'.join(missing),
                  1,
              )
              manifest_path.write_text(manifest, encoding='utf-8')

          # 2. Configurar signingConfigs.release + versionCode + applicationId com.race.app.oficial no build.gradle
          gradle_path = Path('android/app/build.gradle')
          gradle = gradle_path.read_text(encoding='utf-8')
          keystore_abs = str(Path('race-keystore/race-oficial-release.jks').resolve())
          run_num = max(10, int(os.environ.get('BUILD_RUN_NUMBER', '10')))

          assert 'com.race.app.oficial' in gradle, 'ERRO: applicationId com.race.app.oficial não encontrado no build.gradle!'

          gradle = re.sub(r'versionCode\s+\d+', f'versionCode {run_num}', gradle, count=1)
          gradle = re.sub(r'versionName\s+"[^"]+"', f'versionName "2.0.{run_num}"', gradle, count=1)

          signing_block = f'''    signingConfigs {{
                  release {{
                      storeFile file("{keystore_abs}")
                      storePassword "RaceOficial2026Release"
                      keyAlias "raceoficial"
                      keyPassword "RaceOficial2026Release"
                      enableV1Signing true
                      enableV2Signing true
                      enableV3Signing true
                  }}
              }}
              buildTypes {{'''

          assert 'buildTypes {' in gradle, 'ERRO: bloco buildTypes não encontrado no build.gradle!'
          gradle = gradle.replace('buildTypes {', signing_block, 1)

          assert 'minifyEnabled false' in gradle, 'ERRO: minifyEnabled false não encontrado no build.gradle!'
          gradle = gradle.replace(
              'minifyEnabled false',
              'minifyEnabled false\n            debuggable false\n            signingConfig signingConfigs.release',
              1,
          )

          gradle_path.write_text(gradle, encoding='utf-8')
          print('--- android/app/build.gradle configurado ---')
          print(gradle)
          EOF

      - name: Aceitar licenças Android SDK (se necessário)
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -n "$SDK_ROOT" ] && [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Compilar RACE-release.apk ASSINADO via Gradle (assembleRelease)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
          ls -lh app/build/outputs/apk/release/

      - name: Verificar pacote com.race.app.oficial, ausência de debuggable e assinatura v1+v2+v3
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)"
          echo "Build-tools: $BUILD_TOOLS"

          RELEASE_APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$RELEASE_APK" ]; then
            echo "ERRO: app-release.apk assinado não foi gerado!"
            ls -la android/app/build/outputs/apk/release/
            exit 1
          fi

          mkdir -p apk-output
          cp "$RELEASE_APK" apk-output/RACE-release.apk

          echo "=== Verificando assinatura (apksigner verify) ==="
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs apk-output/RACE-release.apk

          echo "=== Verificando metadados do APK (aapt2 dump badging) ==="
          BADGING="$("$BUILD_TOOLS/aapt2" dump badging apk-output/RACE-release.apk)"
          echo "$BADGING" | head -n 30

          echo "$BADGING" | grep -q "package: name='com.race.app.oficial'"
          echo "$BADGING" | grep -q "application-label:'RACE'"
          if echo "$BADGING" | grep -q "application-debuggable"; then
            echo "ERRO: APK ainda está marcado como debuggable!"
            exit 1
          fi
          if echo "$BADGING" | grep -q "testOnly"; then
            echo "ERRO: APK está marcado como testOnly!"
            exit 1
          fi
          ls -lh apk-output/RACE-release.apk

      - name: Publicar RACE-release.apk assinado em Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: RACE-release.apk
          path: apk-output/RACE-release.apk
          retention-days: 90

      - name: Atualizar Release com link direto para baixar RACE-release.apk
        uses: softprops/action-gh-release@v2
        with:
          tag_name: race-apk-latest
          name: RACE-release.apk Oficial (com.race.app.oficial)
          body: |
            APK **RELEASE assinado** diretamente pelo Android Gradle Plugin (`signingConfigs.release` + verificação `apksigner` v1/v2/v3 + `aapt2`) para o novo pacote **`com.race.app.oficial`** — sem conflito com nenhum APK antigo do AppsGeyser, sem debug, sem propaganda.
            - Arquivo: **RACE-release.apk**
            - Package / applicationId: **`com.race.app.oficial`**
            - Nome do app: **RACE**
            - Ícone: **Círculo preto com borda vermelha grossa, R estilizado e RACE em vermelho**
            - Abre direto no app RACE em tela cheia
          files: apk-output/RACE-release.apk
          make_latest: true
